[project]
name = "harbor-agents"
version = "0.1.0"
description = "Harbor agent plugins that run the OpenHands SDK agent loop (via agent-harness)"
requires-python = ">=3.12"
dependencies = [
    "harbor",
    # Supplies the runner script and its docker staging helpers.
    "agent-harness",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.uv.sources]
agent-harness = { path = "../agent-harness", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_agents"]
